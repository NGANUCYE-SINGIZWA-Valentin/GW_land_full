<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="gwBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="60%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#090D16"/>
    </linearGradient>

    <!-- Warm Amber / Primary Orange Gradient -->
    <linearGradient id="gwPrimaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8C38"/>
      <stop offset="50%" stop-color="#F38118"/>
      <stop offset="100%" stop-color="#E06D00"/>
    </linearGradient>

    <!-- Cyan / Azure Secondary Gradient -->
    <linearGradient id="gwCyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="gwShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.4"/>
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#F38118" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Outer Squircle Container -->
  <rect width="512" height="512" rx="128" fill="url(#gwBgGrad)"/>
  
  <!-- Subtle Glass Border -->
  <rect x="6" y="6" width="500" height="500" rx="122" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="4"/>

  <!-- Icon Artwork Group -->
  <g filter="url(#gwShadow)">
    <!-- House Roof Peak (Vibrant Orange Gradient) -->
    <path d="M 256 96 
             C 264 96, 271 100, 277 105 
             L 412 215 
             C 423 224, 424 240, 415 251 
             C 406 262, 390 263, 379 254 
             L 256 154 
             L 133 254 
             C 122 263, 106 262, 97 251 
             C 88 240, 89 224, 100 215 
             L 235 105 
             C 241 100, 248 96, 256 96 Z" 
          fill="url(#gwPrimaryGrad)"/>

    <!-- Left Structural Arc - Stylized 'G' / House Wall (Cyan Gradient) -->
    <path d="M 140 260 
             L 140 376 
             C 140 398, 158 416, 180 416 
             L 224 416 
             C 246 416, 264 398, 264 376 
             L 264 340 
             L 216 340 
             L 216 368 
             L 188 368 
             L 188 290 
             L 248 241 
             L 248 200 
             L 180 255 
             C 156 274, 140 286, 140 260 Z" 
          fill="url(#gwCyanGrad)"/>

    <!-- Right Structural Arc - Stylized 'W' / House Wing (Primary Orange Gradient) -->
    <path d="M 264 241 
             L 324 290 
             L 324 368 
             L 296 368 
             L 296 340 
             L 248 340 
             L 248 376 
             C 248 398, 266 416, 288 416 
             L 332 416 
             C 354 416, 372 398, 372 376 
             L 372 260 
             C 372 286, 356 274, 332 255 
             L 264 200 
             Z" 
          fill="url(#gwPrimaryGrad)"/>

    <!-- Center Window Grid (Glowing White) -->
    <rect x="232" y="272" width="22" height="22" rx="4" fill="#FFFFFF" fill-opacity="0.95"/>
    <rect x="258" y="272" width="22" height="22" rx="4" fill="#FFFFFF" fill-opacity="0.95"/>
    <rect x="232" y="298" width="22" height="22" rx="4" fill="#FFFFFF" fill-opacity="0.95"/>
    <rect x="258" y="298" width="22" height="22" rx="4" fill="#FFFFFF" fill-opacity="0.95"/>
  </g>
</svg>