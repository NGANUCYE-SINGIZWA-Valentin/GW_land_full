<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Google Fonts: Raleway -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet" />

  <!-- Favicon & Manifest -->
  <link rel="icon" type="image/png" href="/favicon/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg" />
  <link rel="shortcut icon" href="/favicon/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png" />
  <link rel="manifest" href="/favicon/site.webmanifest" />
  <meta name="theme-color" content="#F38118" />

  <!-- Meta tags par défaut (surchargés par react-helmet-async) -->
  <title>GW Homes — Find Your Dream Property in Rwanda</title>
  <meta name="description" content="Discover prime real estate across Kigali and beyond. Buy, sell, and rent land, apartments, villas, and commercial properties in Rwanda with GW Homes." />

  <!-- Open Graph par défaut -->
  <meta property="og:title" content="GW Homes — Real Estate in Rwanda" />
  <meta property="og:description" content="Discover prime real estate across Kigali and beyond. Buy, sell, and rent properties in Rwanda with GW Homes." />
  <meta property="og:image" content="/assets/images/gw-homes-og.png" />
  <meta property="og:url" content="https://gwhomes.rw" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="GW Homes" />
  <meta property="og:locale" content="en_US" />

  <!-- Twitter Cards par défaut -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="/assets/images/gw-homes-og.png" />
  <meta name="twitter:site" content="@gwlandrw" />

  <!-- Google Search Console - à remplacer par votre code de vérification -->
  <meta name="google-site-verification" content="YOUR_VERIFICATION_CODE" />

  <!-- Injecté par le pré-rendu SSR (prerender.mjs) -->
  <!--ssr-head-->
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
